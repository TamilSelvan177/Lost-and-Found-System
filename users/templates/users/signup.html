<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 500px;
            margin-top: 100px;
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #5c6bc0;
            margin-bottom: 30px;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #5c6bc0;
            border: none;
            border-radius: 5px;
            color: white;
        }
        .btn-primary:hover {
            background-color: #3f51b5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            height: 45px;
            font-size: 16px;
        }
        .login-link {
            text-align: center;
            display: block;
            margin-top: 20px;
        }
        .login-link a {
            color: #5c6bc0;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Signup</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Signup</button>
    </form>
    <div class="login-link">
        <a href="{% url 'login' %}">Already have an account? Login</a>
    </div>
</div>

</body>
</html>
