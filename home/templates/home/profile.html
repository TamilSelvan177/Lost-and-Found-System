<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f4f7fa;
      font-family: 'Segoe UI', sans-serif;
      padding-top: 50px;
    }

    .container {
      margin-top: 40px;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .card-header {
      background-color: #2d3e50;
      color: #fff;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 30px;
      text-align: center;
      font-size: 28px;
    }

    .card-body {
      padding: 30px;
      background: #fff;
      border-radius: 20px;
      color: #555;
    }

    .profile-info p {
      font-size: 18px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .profile-info strong {
      color: #007bff;
      font-weight: 700;
    }

    .avatar-container {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 25px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #fff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-container:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 30px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0));
    }

    .btn-primary {
      background-color: #007bff;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      width: 100%;
      border-radius: 5px;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .btn-warning {
      background-color: #ffc107;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      width: 100%;
      border-radius: 5px;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .btn-warning:hover {
      background-color: #e0a800;
      transform: scale(1.05);
    }

    .btn-danger {
      background-color: #dc3545;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      width: 100%;
      border-radius: 5px;
      letter-spacing: 1px;
      transition: background-color 0.3s ease;
    }

    .btn-danger:hover {
      background-color: #c82333;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card mx-auto" style="max-width: 600px;">
      <div class="card-header">
        User Profile
      </div>
      <div class="card-body text-center">
        <!-- Avatar Section -->


        <div class="profile-info">
          <p><strong>Username:</strong> {{ user.username }}</p>
          <p><strong>Email:</strong> {{ user.email }}</p>
          <p><strong>Phone number:</strong> {{ user.phone_number|default:"Not Provided" }}</p>
          <p><strong>Address:</strong> {{ user.address|default:"Not Provided" }}</p>
        </div>

        <a href="{% url 'edit_profile' %}" class="btn btn-warning mt-3">Edit Profile</a>
        <a href="{% url 'logout' %}" class="btn btn-danger mt-3">Logout</a>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>

</html>
