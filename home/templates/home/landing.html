<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .left, .right {
      flex: 1;
      padding: 40px;
      box-sizing: border-box;
    }

    .left {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .left h1 {
      font-size: 3em;
      max-width: 80%;
      line-height: 1.3;
    }

    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 40px 20px;
    }

    .buttons {
      margin-top: 20px;
    }

    .buttons a {
      text-decoration: none;
      background: #fff;
      color: #764ba2;
      padding: 12px 28px;
      margin: 10px;
      border-radius: 8px;
      font-size: 1.1em;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .buttons a:hover {
      background: #eee;
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 10px 0;
      background-color: rgba(0,0,0,0.2);
      color: #eee;
    }

    @media (max-width: 768px) {
      .main {
        flex-direction: column;
      }

      .left, .right {
        width: 100%;
        text-align: center;
      }

      .left h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="left">
      <h1>Welcome to the Lost & Found Portal</h1>
    </div>
    <div class="right">
      <h2>Get Started</h2>
      <div class="buttons">
        <a href="/users/login/">Login</a>
        <a href="/users/signup/">Sign Up</a>
      </div>
    </div>
  </div>
  <footer>
    &copy; 2025 Your Site. All rights reserved.
  </footer>
</body>
</html>
