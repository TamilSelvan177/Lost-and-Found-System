<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Lost & Found</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background-color: #2e86de;
      color: white;
      padding: 30px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #1a5276;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 1rem;
      background-color: #2e86de;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1b4f72;
    }

    .footer {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
      background-color: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>Contact Us</h1>
  <p>We’re here to help. Reach out with any questions or concerns.</p>
</header>

<div class="container">
  <h2>Send a Message</h2>
  <form action="#" method="post">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required />

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required />

    <label for="subject">Subject</label>
    <input type="text" id="subject" name="subject" required />

    <label for="message">Message</label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit">Submit</button>
  </form>

  <h3 style="margin-top: 50px;">Other Ways to Reach Us</h3>
  <p>Email: <a href="mailto:support@lostfound.com">support@lostfound.com</a></p>
  <p>Follow us: 
    <a href="#" target="_blank">Instagram</a> | 
    <a href="#" target="_blank">Facebook</a>
  </p>
</div>

<div class="footer">
  &copy; 2025 Lost & Found System | All rights reserved
</div>

</body>
</html>
